[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-baseline"
version = "0.1.0"
description = "Blacklist-mode guardrails, workspace isolation and secret detection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# Hooks-only plugin: no importable package, so nothing ships in a wheel.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]

# Hooks-only plugin: there is no importable Python package here, so mypy has no
# target. The behaviour suite in tests/unit/test_hooks.py is the real gate.
[tool.mypy]
files = []
mypy_path = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
